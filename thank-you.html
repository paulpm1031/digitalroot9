<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>Enquiry received | DigitalRoot9 AI &amp; Process Improvement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: radial-gradient(ellipse at 80% 10%, rgba(100, 181, 246, .15), transparent 38%), #121212;
      color: #e0e0e0;
      font-family: "DM Sans", sans-serif;
    }
    .card {
      width: min(100%, 620px);
      padding: clamp(30px, 7vw, 58px);
      border: 1px solid rgba(224, 224, 224, .17);
      border-radius: 12px;
      background: rgba(26, 26, 26, .92);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .35);
    }
    .brand { display: flex; align-items: center; gap: 10px; color: inherit; font: 700 .98rem "Space Grotesk", sans-serif; }
    .brand img { width: 34px; height: 34px; object-fit: contain; }
    .eyebrow { margin-top: 38px; color: #81c784; font-size: .74rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 13px 0 0; font: 700 clamp(2.6rem, 8vw, 4.6rem)/1 "Space Grotesk", sans-serif; letter-spacing: -.055em; }
    p { max-width: 470px; margin: 20px 0 0; color: #a0a0a0; font-size: 1.02rem; line-height: 1.65; }
    .button { display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; padding: 13px 18px; border-radius: 5px; background: #81c784; color: #121212; font-size: .88rem; font-weight: 700; text-decoration: none; }
    .button:hover { background: #9bd69e; }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/" aria-label="DigitalRoot9 home">
      <img src="Emblem_NB.png" alt="">
      <span>DigitalRoot9</span>
    </a>
    <div class="eyebrow">Enquiry received</div>
    <h1>Thanks.<br>Let’s make work work better.</h1>
    <p>Your message is on its way. A DigitalRoot9 consultant will be in touch to learn more about your operations, improvement goals, and where AI or automation may help.</p>
    <a class="button" href="/">Back to DigitalRoot9 <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
